_target_: sda_dls.data.data_loader.TwoStageDataModule
switch_epoch: ${model.epochs_gan}
first_train_set:
  _target_: sda_dls.data.image_folder.UnpairedImageFolder
  root_A: '${paths.data_dir}/source/train'
  root_B: '${paths.data_dir}/target/train'
  transform_list:
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.v2.RandomResizedCrop
      size: 256
      scale: [0.7, 1.0]
      antialias: true
    - _target_: torchvision.transforms.v2.RandomHorizontalFlip
    - _target_: torchvision.transforms.v2.Normalize
      mean:
      - 0.5
      - 0.5
      - 0.5
      std:
      - 0.5
      - 0.5
      - 0.5
snd_train_set:
  _target_: sda_dls.data.image_folder.UnpairedImageFolder
  root_A: '${paths.data_dir}/source/train'
  root_B: '${paths.data_dir}/target/train'
  labels_path: ${paths.data_dir}/labels.json
  transform_list:
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.v2.RandomResizedCrop
      size: 256
      scale: [0.7, 1.0]
      antialias: true
    - _target_: torchvision.transforms.v2.Normalize
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]
batch_size_train_first: 4
batch_size_train_snd: 32
num_workers_train: 4
val_set:
  _target_: sda_dls.data.image_folder.SingleDomainImageFolder
  root: '${paths.data_dir}/target_full/val'
  labels_path: '${paths.data_dir}/labels.json'
  transform_list:
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.v2.Resize
      size: 256
      antialias: true
    - _target_: torchvision.transforms.v2.CenterCrop
      size: 224
    - _target_: torchvision.transforms.v2.Normalize
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]
batch_size_val: 128
num_workers_val: 4
test_set:
  _target_: sda_dls.data.image_folder.SingleDomainImageFolder
  root: '${paths.data_dir}/target_full/test'
  labels_path: '${paths.data_dir}/labels.json'
  transform_list:
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.v2.Resize
      size: 256
      antialias: true
    - _target_: torchvision.transforms.v2.CenterCrop
      size: 224
    - _target_: torchvision.transforms.v2.Normalize
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]
batch_size_test: 128
num_workers_test: 4