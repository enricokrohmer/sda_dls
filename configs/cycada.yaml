data:
  _target_: sda_dls.data.data_loader.TwoStageDataModule
  switch_epoch: ${model.epochs_gan}
  first_train_set:
    _target_: sda_dls.data.image_folder.UnpairedImageFolder
    root_A: ${paths.data_dir}/source/train
    root_B: ${paths.data_dir}/target_partial_split/train
    labels_path: ${paths.data_dir}/labels.json
    transform_list:
    - _target_: torchvision.transforms.Resize
      size:
      - 276
      - 276
    - _target_: torchvision.transforms.RandomCrop
      size:
      - 256
      - 256
    - _target_: torchvision.transforms.RandomHorizontalFlip
      p: 0.5
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.Normalize
      mean:
      - 0.5
      - 0.5
      - 0.5
      std:
      - 0.5
      - 0.5
      - 0.5
  snd_train_set:
    _target_: sda_dls.data.image_folder.UnpairedImageFolder
    root_B: ${paths.data_dir}/target_partial_split/val
    root_A: ${paths.data_dir}/source/train
    labels_path: ${paths.data_dir}/labels.json
    transform_list:
    - _target_: torchvision.transforms.Resize
      size:
      - 256
      - 256
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.Normalize
      mean:
      - 0.5
      - 0.5
      - 0.5
      std:
      - 0.5
      - 0.5
      - 0.5
  batch_size_train_first: 4
  batch_size_train_snd: 16
  num_workers_train: 4
  val_set:
    _target_: sda_dls.data.image_folder.SingleDomainImageFolder
    root: ${paths.data_dir}/target_full/val
    labels_path: ${paths.data_dir}/labels.json
    transform_list:
    - _target_: torchvision.transforms.Resize
      size:
      - 224
      - 224
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.Normalize
      mean:
      - 0.5
      - 0.5
      - 0.5
      std:
      - 0.5
      - 0.5
      - 0.5
  batch_size_val: 128
  num_workers_val: 4
  test_set:
    _target_: sda_dls.data.image_folder.SingleDomainImageFolder
    root: ${paths.data_dir}/target_full/test
    labels_path: ${paths.data_dir}/labels.json
    transform_list:
    - _target_: torchvision.transforms.Resize
      size:
      - 224
      - 224
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.Normalize
      mean:
      - 0.5
      - 0.5
      - 0.5
      std:
      - 0.5
      - 0.5
      - 0.5
  batch_size_test: 128
  num_workers_test: 4
model:
  _target_: sda_dls.models.model.TwoStepClassifier
  task_strategy:
    _target_: sda_dls.models.strategies.gan_aided_strategies.CycadaDANN
    classifier:
      _target_: sda_dls.base.networks.classifiers.ConvNext
      network: convnext_tiny
      num_classes: 156
      load_imagenet: true
    discriminator:
      _target_: sda_dls.base.networks.misc.DiscriminatorDANN
      input_nc: 768
      ndf: 1024
      norm: null
    lambda_disc: 0.5
    transforms:
      _target_: kornia.augmentation.container.AugmentationSequential
      _args_:
      - _target_: kornia.enhance.Denormalize
        mean: 0.5
        std: 0.5
      - _target_: kornia.augmentation.RandomCrop
        size:
        - 224
        - 224
      - _target_: kornia.augmentation.auto.RandAugment
        'n': 2
        m: 14
      - _target_: kornia.enhance.Normalize
        mean: 0.5
        std: 0.5
      same_on_batch: false
    acc_threshold: 0.6
    label_smoothing: 0.1
    weight_init:
      _target_: torch.nn.init.normal_
      _partial_: true
      mean: 0.0
      std: 0.02
    stages_to_freeze: 2
    val_metrics:
      _target_: torchmetrics.MetricCollection
      prefix: val_
      metrics:
      - _target_: torchmetrics.classification.MulticlassF1Score
        num_classes: ${model.task_strategy.classifier.num_classes}
        average: none
    test_metrics:
      _target_: torchmetrics.MetricCollection
      prefix: test_
      metrics:
      - _target_: torchmetrics.classification.MulticlassF1Score
        num_classes: ${model.task_strategy.classifier.num_classes}
        average: none
      - _target_: torchmetrics.classification.MulticlassPrecision
        num_classes: ${model.task_strategy.classifier.num_classes}
        average: none
      - _target_: torchmetrics.classification.MulticlassRecall
        num_classes: ${model.task_strategy.classifier.num_classes}
        average: none
    nc_src: 21
  cgan_strategy:
    _target_: sda_dls.models.strategies.cyclegan_strategies.CyCADAStrategy
    classifier: ${model.task_strategy.classifier}
    generator:
      _target_: sda_dls.base.networks.generators.ResnetGenerator
      input_nc: 3
      output_nc: 3
      ngf: 64
      use_dropout: true
      norm: instance
      n_blocks: 9
      padding_type: reflect
    discriminator:
      _target_: sda_dls.base.networks.discriminators.NLayerDiscriminator
      image_shape:
      - 3
      - 224
      - 224
      norm: instance
    criterion_gan:
      _target_: sda_dls.base.torch.losses.GANLoss
      gan_mode: lsgan
    lambda_cycle: 10
    lambda_sem: 10
    weight_init: ${model.task_strategy.weight_init}
    queue_size: 50
    AtoB: true
    pretrained_path_C:
      - outputs/2024-07-22/extractor/checkpoints/best.ckpt
      - net_C
  lr_C: 0.0002
  lr_G: 0.0002
  lr_D: 0.0002
  wd_C: 0.1
  wd_gan: 0.05
  epochs_gan: 60
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    amsgrad: false
  scheduler_C:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: 60
    eta_min: 0.0
    last_epoch: -1
    verbose: true
  scheduler_gan:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${model.epochs_gan}
    eta_min: 0.0
    last_epoch: -1
    verbose: true
  compile: true
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  max_epochs: 120
  accelerator: gpu
  devices:
  - 3
  log_every_n_steps: 20
  check_val_every_n_epoch: 4
  deterministic: false
  reload_dataloaders_every_n_epochs: ${model.epochs_gan}
callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: '{epoch}-{val_MulticlassF1Score_source: .3f}'
    monitor: val_MulticlassF1Score_source
    verbose: false
    save_last: null
    save_top_k: -1
    mode: max
    auto_insert_metric_name: true
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: ${trainer.check_val_every_n_epoch}
    save_on_train_epoch_end: null
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: 1
  rich_progress_bar:
    _target_: lightning.pytorch.callbacks.RichProgressBar
  img_logger:
    _target_: sda_dls.callbacks.images.ImageLoggingCallback
    print_freq: 100
    deactivation_epoch: ${model.epochs_gan}
logger:
  wandb:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    name: ${experiment_name}
    save_dir: ${paths.output_dir}
    offline: false
    id: null
    anonymous: null
    project: sda_dls
    log_model: false
    prefix: ''
    group: ''
    tags: []
    job_type: ''
paths:
  root_dir: .
  data_dir: ${paths.root_dir}/datasets/ccsv2ssb/
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
extras:
  ignore_warnings: false
  enforce_tages: true
  print_config: true
experiment_name: cycada
train: true
